services:
  - type: web
    name: immigration-helper-ai
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: OPENAI_REVIEW_MODEL
        value: gpt-5.6-luna
      - key: REQUIRE_AI_GENERATION
        value: "true"
      - key: AI_PROXY_CLIENT_TOKEN
        sync: false
      - key: REQUIRE_CLIENT_TOKEN
        value: "true"
      - key: REQUIRE_AI_ACCESS_CONTROL
        value: "true"
      - key: CASEPILOT_ACCESS_STORE_PATH
        value: /var/data/casepilot-access.json
      - key: REVENUECAT_API_KEY
        sync: false
      - key: PLUS_ENTITLEMENT_ID
        value: immigration_helper_plus
      - key: FREE_AI_QUESTION_LIMIT
        value: "10"
      - key: CASEPILOT_SUBJECT_WINDOW_LIMIT
        value: "30"
      - key: CASEPILOT_IP_WINDOW_LIMIT
        value: "90"
      - key: CASEPILOT_GLOBAL_DAILY_LIMIT
        value: "500"
      - key: CASEPILOT_RATE_WINDOW_SECONDS
        value: "600"
      - key: USCIS_VECTOR_STORE_ID
        sync: false
      - key: ALLOWED_ORIGIN
        value: https://kaiscout.github.io
    disk:
      name: casepilot-access-data
      mountPath: /var/data
      sizeGB: 1
