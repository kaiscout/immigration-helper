services:
  - type: web
    name: immigration-helper-ai
    runtime: docker
    plan: starter
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.6-sol
      - key: REQUIRE_AI_GENERATION
        value: "true"
      - key: AI_PROXY_CLIENT_TOKEN
        sync: false
      - key: REQUIRE_CLIENT_TOKEN
        value: "true"
      - key: USCIS_VECTOR_STORE_ID
        sync: false
      - key: ALLOWED_ORIGIN
        value: "*"
      - key: CASEPILOT_TEST_TRACE_SESSION
        value: casepilot-review-52f1d56f-6dbc-49d2-9d37-f8c1b77ed9e9
